# webtermin system configuration (installed as conffile by .deb).
# Local edits are preserved across upgrades.

server:
  listen: "0.0.0.0:8443"
  # Leave empty to auto-generate a self-signed cert into data_dir/tls/.
  # Point at your own PEMs to use a CA-issued certificate instead.
  tls_cert: ""
  tls_key: ""
  external_host: ""

# System-wide data directory: SQLite DB, sessions, generated TLS cert.
data_dir: "/var/lib/webtermin"

security:
  session_ttl_min: 240
  pty_idle_timeout_min: 30
  require_2fa: false
  max_login_attempts: 5
  lockout_min: 15

terminal:
  # Empty = use the Linux user's default shell from /etc/passwd, fallback /bin/bash.
  default_shell: ""

logging:
  level: "info"

# Telegram alerts. Create a bot with @BotFather, send it a message, then get
# your chat id from https://api.telegram.org/bot<TOKEN>/getUpdates. Keep this
# file mode 0640 root — the token lets anyone post as the bot.
notify:
  telegram:
    bot_token: ""
    chat_id: ""
  # Empty = all: login (new IP), lockout, denied, reboot, setup,
  # service_failed, disk, updates.
  events: []
  disk_pct: 90
