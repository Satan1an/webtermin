<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="webtermin — beautiful, secure server control panel">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#0a1530"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#00DC82" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#00DC82" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#00DC82" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1f2a44" opacity="0.55"/>
    </pattern>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00DC82"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <rect width="1200" height="360" fill="url(#glow)"/>

  <!-- Top-left badge: logo mark -->
  <g transform="translate(96, 116)">
    <rect x="0" y="0" width="84" height="84" rx="20" fill="url(#accent)"/>
    <rect x="0" y="0" width="84" height="84" rx="20" fill="#00DC82" opacity="0.0"/>
    <g transform="translate(0,0)" fill="none" stroke="#06121f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="24,30 40,42 24,54"/>
      <line x1="46" y1="58" x2="64" y2="58"/>
    </g>
  </g>

  <!-- Title -->
  <g transform="translate(220, 138)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="0" y="0" font-size="76" font-weight="700" fill="#f1f5f9" letter-spacing="-2">
      webtermin
    </text>
    <text x="6" y="42" font-size="20" font-weight="500" fill="#94a3b8" letter-spacing="0.2">
      self-hosted server control panel · TLS · Argon2id · web terminal
    </text>
  </g>

  <!-- Pills row -->
  <g transform="translate(220, 220)" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="500">
    <g transform="translate(0,0)">
      <rect x="0" y="0" width="118" height="32" rx="16" fill="#0f2236" stroke="#00DC82" stroke-opacity="0.4"/>
      <circle cx="18" cy="16" r="4" fill="#00DC82"/>
      <text x="30" y="21" fill="#cbd5e1">systemd · D-Bus</text>
    </g>
    <g transform="translate(132,0)">
      <rect x="0" y="0" width="100" height="32" rx="16" fill="#0f2236" stroke="#22d3ee" stroke-opacity="0.4"/>
      <circle cx="18" cy="16" r="4" fill="#22d3ee"/>
      <text x="30" y="21" fill="#cbd5e1">PTY · xterm</text>
    </g>
    <g transform="translate(246,0)">
      <rect x="0" y="0" width="92" height="32" rx="16" fill="#0f2236" stroke="#c084fc" stroke-opacity="0.4"/>
      <circle cx="18" cy="16" r="4" fill="#c084fc"/>
      <text x="30" y="21" fill="#cbd5e1">audit log</text>
    </g>
    <g transform="translate(352,0)">
      <rect x="0" y="0" width="80" height="32" rx="16" fill="#0f2236" stroke="#ffd166" stroke-opacity="0.4"/>
      <circle cx="18" cy="16" r="4" fill="#ffd166"/>
      <text x="30" y="21" fill="#cbd5e1">TOTP 2FA</text>
    </g>
    <g transform="translate(446,0)">
      <rect x="0" y="0" width="86" height="32" rx="16" fill="#0f2236" stroke="#94a3b8" stroke-opacity="0.4"/>
      <circle cx="18" cy="16" r="4" fill="#94a3b8"/>
      <text x="30" y="21" fill="#cbd5e1">Go · React</text>
    </g>
  </g>

  <!-- Decorative terminal prompt on the right -->
  <g transform="translate(740, 90)" font-family="JetBrains Mono, ui-monospace, monospace" font-size="14">
    <rect x="0" y="0" width="380" height="180" rx="14" fill="#0a1020" stroke="#1e293b"/>
    <g transform="translate(14, 14)">
      <circle cx="0" cy="0" r="6" fill="#fb7185"/>
      <circle cx="18" cy="0" r="6" fill="#fbbf24"/>
      <circle cx="36" cy="0" r="6" fill="#34d399"/>
    </g>
    <g fill="#e6edf3">
      <text x="20" y="56">$ systemctl status nginx</text>
      <text x="20" y="80" fill="#34d399">  active (running)  since now</text>
      <text x="20" y="104">$ webtermin --version</text>
      <text x="20" y="128" fill="#94a3b8">  v0.1.0  linux/arm64  static</text>
      <text x="20" y="152" fill="#00DC82">▍</text>
    </g>
  </g>
</svg>
