name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build + vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build SPA
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: go vet
        run: go vet ./...

      - name: gofmt (formatting must be clean)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go build (host arch)
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags="-s -w" -o /tmp/webtermin ./cmd/webtermin

      - name: Cross-build linux/arm64
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: arm64
        run: go build -trimpath -ldflags="-s -w" -o /tmp/webtermin-arm64 ./cmd/webtermin

      - name: Upload host binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: webtermin-snapshot-${{ github.sha }}
          path: /tmp/webtermin*
          retention-days: 7

  static-analysis:
    name: staticcheck + gosec + govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # The Go analyzers parse imports but don't need the SPA to exist with content;
      # just keep the embed target present so `embed.FS` resolves.
      - name: Stub embed target
        run: mkdir -p web/dist && touch web/dist/.gitkeep

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: gosec (HIGH severity)
        uses: securego/gosec@master
        with:
          args: '-severity high -confidence medium -fmt sarif -out gosec.sarif ./...'

      - name: govulncheck (Go stdlib + dependency CVEs)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Upload gosec SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gosec-sarif-${{ github.sha }}
          path: gosec.sarif
          retention-days: 30

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks scans full history

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
