name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly re-run so govulncheck reports CVEs published after the last commit.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  build:
    name: build + vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'  # newest supported Go: stdlib CVE fixes, never an EOL toolchain
          cache: true

      - name: Build SPA
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: go vet
        run: go vet ./...

      - name: gofmt (formatting must be clean)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go test (with race detector)
        run: go test -race -count=1 ./...

      - name: go build (host arch)
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags="-s -w" -o /tmp/webtermin ./cmd/webtermin

      - name: Cross-build linux/arm64
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: arm64
        run: go build -trimpath -ldflags="-s -w" -o /tmp/webtermin-arm64 ./cmd/webtermin

      - name: Upload host binary as artifact
        uses: actions/upload-artifact@v7
        with:
          name: webtermin-snapshot-${{ github.sha }}
          path: /tmp/webtermin*
          retention-days: 7

  e2e:
    name: e2e (Playwright, systemd stand)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Host binary from the build job, SPA already embedded.
      - uses: actions/download-artifact@v7
        with:
          name: webtermin-snapshot-${{ github.sha }}
          path: ${{ runner.temp }}/bin

      - name: Run e2e suite
        env:
          WT_BINARY: ${{ runner.temp }}/bin/webtermin
        run: |
          chmod +x "$WT_BINARY"
          e2e/run.sh

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.sha }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14

  static-analysis:
    name: staticcheck + gosec + govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'  # newest supported Go: stdlib CVE fixes, never an EOL toolchain
          cache: true

      # The Go analyzers parse imports but don't need the SPA to exist with content;
      # just keep the embed target present so `embed.FS` resolves.
      - name: Stub embed target
        run: mkdir -p web/dist && touch web/dist/.gitkeep

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      # Full SARIF for the GitHub Security tab — always succeeds, captures every
      # severity level. We upload the resulting file as an artifact below.
      - name: gosec (SARIF report, all severities)
        run: gosec -no-fail -fmt sarif -out gosec.sarif ./...

      # Strict gate: only HIGH severity, HIGH confidence — these are the findings
      # that we actually want to block CI on. Exclude rules whose default checks
      # are false-positives for a server-management tool that intentionally
      # reads/writes arbitrary admin-supplied paths and creates files with the
      # standard user-readable modes:
      #   G104 — unhandled error on cleanup paths (idiomatic Go)
      #   G301 — directory 0o755 (intentional for mkdir-like behaviour)
      #   G302 — file 0o644 (intentional for uploads)
      #   G304 — file path from variable (the entire point of internal/files)
      #   G703 — taint-analysis variant of the same path-from-variable concern
      - name: gosec (fail on HIGH severity only)
        run: gosec -severity high -confidence high -exclude=G104,G301,G302,G304,G703 ./...

      - name: govulncheck (Go stdlib + dependency CVEs)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Upload gosec SARIF
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gosec-sarif-${{ github.sha }}
          path: gosec.sarif
          retention-days: 30

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # gitleaks scans full history

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
