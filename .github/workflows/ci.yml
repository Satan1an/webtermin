name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build + vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build SPA
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: go vet
        run: go vet ./...

      - name: go build (host arch)
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags="-s -w" -o /tmp/webtermin ./cmd/webtermin

      - name: Cross-build linux/arm64
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: arm64
        run: go build -trimpath -ldflags="-s -w" -o /tmp/webtermin-arm64 ./cmd/webtermin

      - name: Upload host binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: webtermin-snapshot-${{ github.sha }}
          path: /tmp/webtermin*
          retention-days: 7
