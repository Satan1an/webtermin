name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write    # for creating the Release + uploading artefacts

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0    # GoReleaser uses git history for changelogs

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'  # newest supported Go: stdlib CVE fixes, never an EOL toolchain
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
