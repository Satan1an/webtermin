name: Feature request
description: Suggest a new module, action, or improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case, not the implementation. "I want to do X but currently I have to Y" is ideal.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like webtermin to handle this? Mockups or rough sketches welcome.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you've tried, or other tools that solve this.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I checked the roadmap in README.md and this isn't already planned.
          required: true
